url: https://ropenspain.github.io/CatastRo/

development:
  mode: auto

repo:
  branch: main

template:
  bootstrap: 5
  package: rostemplate

figures:
  dpi: 300
  fig.retina: 2

home:
  title: CatastRo
  description: >
    Access public spatial data from the Spanish Cadastre through INSPIRE and
    OVC services.

authors:
  Ángel Delgado Panadero:
    href: https://github.com/DelgadoPanadero
  Diego Hernangómez:
    href: "https://dieghernan.github.io/"
  Iñaki Ucar:
    href: "https://www.enchufa2.es/"

reference:
- title: Retrieve cadastral data
  desc: >
    Download complete municipal datasets, query individual cadastral features
    and retrieve georeferenced map images.
- subtitle: Complete municipal datasets
  desc: >
    Discover and download complete address, building and cadastral parcel
    datasets through ATOM INSPIRE services.
- contents:
  - has_concept("atom_services")
  - -catr_atom_search_munic
- subtitle: Features by area or identifier
  desc: >
    Query address, building and cadastral parcel features through WFS INSPIRE
    services.
- contents:
  - has_concept("wfs_services")

- subtitle: Georeferenced map images
  desc: >
    Download cadastral map layers through the WMS INSPIRE service.
- contents:
  - catr_wms_get_layer

- title: Find cadastral identifiers
  desc: >
    Convert between cadastral references and coordinates, or look up province
    and municipality codes.
- subtitle: References and coordinates
  desc: >
    Geocode cadastral references and reverse geocode spatial coordinates.
- contents:
  - has_concept("cadastral_references")

- subtitle: Province and municipality lookup
  desc: >
    Find Spanish Cadastre province and municipality identifiers by name, code
    or coordinates.
- contents:
  - has_concept("search_tools")

- title: Configure and inspect CatastRo
  desc: >
    Manage downloaded files, inspect supported coordinate systems and access
    package-level documentation.
- subtitle: Cache management
  desc: >
    Configure, detect and clear the local cache used by **CatastRo**.
- contents:
  - has_concept("cache_utilities")
- subtitle: Coordinate reference systems
  desc: >
    Inspect the SRS codes supported by the package services.
- contents:
  - has_keyword("datasets")

- subtitle: Package overview
  desc: >
    Read package-level documentation and discover useful links.
- contents:
  - CatastRo-package

articles:
- title: Detailed service guide
  desc: >
    Explore service-specific workflows and query patterns.
  navbar: ~
  contents:
  - ovcservice
